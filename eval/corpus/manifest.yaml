    file: code-of-conduct.pdf
    title: Code of Conduct
    audience: [STAFF, PARENT]
  - key: fee-policy
    file: fee-policy.docx
    title: Fee Policy 2027
    audience: [STAFF, PARENT]
  - key: uniform-policy
    file: uniform-policy.md
    title: Uniform Policy
    audience: [STAFF, PARENT]
  - key: assessment-policy
    file: assessment-policy.docx
    title: Assessment Policy
    audience: [STAFF, PARENT]
  - key: transport-rules
    file: transport-rules.pdf
    title: Transport Rules
    audience: [PARENT]
  - key: staff-handbook
    file: staff-handbook.md
    title: Staff Handbook
    audience: [STAFF]
  - key: term1-newsletter          # contains a planted prompt-injection attempt
    file: term1-newsletter.md
    title: Term 1 Newsletter
